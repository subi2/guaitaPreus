:root{
  --bg:#0E1116; --bg-deep:#0B0D10; --bg-deep2:#12161B; --bg-panel:#171B21; --bg-surface:#1E232B;
  --bg-control:#1E232B; --bg-track:#0E1116; --bg-hover:#252B34;
  --border:#2A313B; --border-soft:#222831; --border-hov:#3A424E; --border-strong:#4A5361;
  --text:#D6DBE1; --text-soft:#C6CCD4; --text-strong:#D6DBE1; --text-mid:#AEB6C0;
  --text-mut:#8B939F; --text-dim:#8B939F; --text-dim2:#5C6470; --text-faint:#454C57;
  --accent:#D6FB41; --accent-hover:#E2FF6E; --accent-line:#D6FB41; --accent-text:#D6FB41;
  --on-accent:#1A2000; --accent-ink:#D6FB41;
  --accent-soft:rgba(214,251,65,.08); --accent-soft2:rgba(214,251,65,.18);
  --green:#6EE7A8; --green-bg:#12261D; --cyan:#4DD0E1; --cyan-bg:#0F2226;
  --err-bg:#3A1A1E; --err-text:#FFD0D0; --danger:#FF5E5E; --warn:#FFB546; --warn-bg:#3A2F10; --warn-text:#FFD98A; --warn-line:#F5B942;
  --overlay-bg:rgba(23,27,33,.96); --viewport:#D5D9DE; --shadow:rgba(0,0,0,.55);
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
body.light{
  --bg:#F4F5F7; --bg-deep:#ECEEF1; --bg-deep2:#F0F2F5; --bg-panel:#FFFFFF; --bg-surface:#F1F3F5;
  --bg-control:#FFFFFF; --bg-track:#E6E9ED; --bg-hover:#E9ECF0;
  --border:#D5DAE0; --border-soft:#E6E9ED; --border-hov:#B8C0CA; --border-strong:#9AA3AE;
  --text:#161A20; --text-soft:#23282F; --text-strong:#161A20; --text-mid:#3D4652;
  --text-mut:#5C6470; --text-dim:#6B7380; --text-dim2:#8B939F; --text-faint:#A9B0B9;
  --accent:#D6FB41; --accent-hover:#CDF232; --accent-line:#8DB300; --accent-text:#5E7700;
  --on-accent:#1A2000; --accent-ink:#5E7700;
  --accent-soft:rgba(141,179,0,.10); --accent-soft2:rgba(141,179,0,.22);
  --green:#2E8A57; --green-bg:#E3F4EA; --cyan:#00806A; --cyan-bg:#DFF2ED;
  --err-bg:#FBE3E0; --err-text:#A92315; --danger:#D93636; --warn:#B86E00; --warn-bg:#FDF0D0; --warn-text:#7A5200; --warn-line:#B86E00;
  --overlay-bg:rgba(255,255,255,.96); --viewport:#DADDE2; --shadow:rgba(0,0,0,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;font-size:12px;color:inherit}
button{padding:5px 10px;border:1px solid var(--border);border-radius:4px;background:var(--bg-control);color:var(--text-soft);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover{background:var(--bg-hover);border-color:var(--border-strong)}
button.pri{background:var(--accent);border-color:var(--accent-line);color:var(--on-accent);font-weight:600}
button.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.ghost{background:none;border-color:transparent}
button.ghost:hover{background:var(--bg-hover);border-color:var(--border)}
button:disabled{opacity:.35;cursor:not-allowed}
input,select,textarea{background:var(--bg-control);border:1px solid var(--border);border-radius:4px;padding:4px 7px;min-width:0;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line)}
input:disabled{opacity:.5}
input[type=checkbox]{accent-color:var(--accent-line)}
textarea{width:100%;resize:vertical;min-height:70px;font-family:var(--sans);font-size:13px}
.mono,.num{font-family:var(--mono)}
.num{text-align:right;white-space:nowrap}
.mu{color:var(--text-dim)}
.ac{color:var(--accent-text)}
/* capçalera */
header.top{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border-bottom:2px solid var(--accent-line);padding:7px 14px 6px;flex:none;position:relative;z-index:50}
.brandw{display:flex;align-items:center;gap:8px;margin-right:6px}
.cells{display:grid;grid-template-columns:7px 7px;gap:2px;flex:none}
.cells i{display:block;width:7px;height:7px}
.cells i:nth-child(1){background:#D6FB41}.cells i:nth-child(2){background:#FF2ECC}.cells i:nth-child(3){background:#00E5FF}.cells i:nth-child(4){background:#FFE500}
.brand{font:900 17px 'Arial Black',system-ui,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent-text)}
.brand em{font-style:normal;color:var(--text)}
.ver{font:10px var(--mono);color:var(--text-dim2);border:1px solid var(--border);border-radius:3px;padding:0 5px;margin-left:2px}
nav.menu{display:flex;gap:2px}
.mi{position:relative}
.mi>.mb{background:transparent;border:1px solid transparent;color:var(--text-soft);font:600 12px system-ui,sans-serif;letter-spacing:.5px;padding:5px 11px;border-radius:4px}
.mi.open>.mb,.mi>.mb:hover{background:var(--bg-hover);border-color:var(--border-strong);color:var(--accent-text)}
.dd{display:none;position:absolute;left:0;top:100%;min-width:250px;background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:6px;padding:4px;box-shadow:0 8px 24px var(--shadow);margin-top:4px;z-index:60}
.open>.dd{display:block}
.dd .it{display:flex;justify-content:space-between;gap:18px;padding:7px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;position:relative;font:12px system-ui,sans-serif;color:var(--text-soft)}
.dd .it:hover{background:var(--accent-soft2);color:var(--accent-text)}
.dd .it.dis{opacity:.35;pointer-events:none}
.dd .it.chk::before{content:'✓';position:absolute;left:-1px;color:var(--accent-text);font-size:11px}
.dd .sep{height:1px;background:var(--border);margin:4px 2px}
.dd .sub>.dd{left:100%;top:-5px;margin-top:0}
.dd .sub:hover>.dd{display:block}
.dd .it .k{color:var(--text-dim2);font-size:10px}
.sp{flex:1}

  if (intro) rows.push(h('p', { class: 'mu' }, intro));
  for (const f of fields) {
    let e;
    if (f.type === 'select') e = h('select', null, f.opts.map(o => h('option', { value: o[0], selected: String(o[0]) === String(f.v) }, o[1])));
    else if (f.type === 'check') e = h('input', { type: 'checkbox', checked: !!f.v });
    else e = h('input', { type: 'text', value: f.v == null ? '' : f.v, style: { width: '100%' }, onkeydown: ev => { if (ev.key === 'Enter') { const b = document.querySelector('.mbox .ft .pri'); if (b) b.click(); } } });
    els[f.k] = e;
    rows.push(f.type === 'check' ? h('div', { class: 'row' }, e, h('label', null, f.l)) : h('div', { class: 'f', style: { marginBottom: '8px' } }, h('label', null, f.l), e));
  }
  const ok = await U.modal(title, h('div', null, rows), [{ l: 'Cancel·la', v: false }, { l: okLabel || 'Accepta', v: true, pri: 1 }]);
  if (!ok) return null; const out = {};
  for (const f of fields) out[f.k] = f.type === 'check' ? els[f.k].checked : els[f.k].value;
  return out;
};

  else if (fmt === 'html') U.download(n + '.html', G.toHTML(doc), 'text/html;charset=utf-8');

  U.status('Exportat ' + fmt.toUpperCase(), 'ok', 4000);

    const body = h('div', null, h('div', { class: 'msg ' + (orph.length ? 'wa' : 'ok') }, orph.length ? orph.length + ' assignacions del mapejat apunten a codis que desapareixen; es mantindran marcades amb ⚠ perquè les puguis reubicar.' : 'Cap assignació existent queda òrfena.'),
      list(df.added, ['codis nous', e => '+ ' + e.code + ' ' + e.desc]), list(df.removed, ['codis eliminats', e => '− ' + e.code + ' ' + e.desc]), list(df.changed, ['descripcions canviades', e => '~ ' + e.code + ': ' + e.from + ' → ' + e.to]), r.warnings.length ? list(r.warnings, [r.warnings.length + ' avisos', x => x]) : null);

    const meta = { source: a.s.trim(), file: file.name, date: new Date().toISOString().slice(0, 10) }; G.gbcSet(r.entries, ver, meta); U.aux.gbc = { version: ver, meta, entries: r.entries }; U.saveAux('gbc'); U.buildMenus && U.buildMenus(); U.renderAll();
    U.status('GuBIMClass v.' + ver + ' carregada (' + r.entries.length + ' codis)', 'ok', 6000);
  } catch (e) { U.status(''); U.info('No s\'ha pogut importar', h('div', { class: 'msg er' }, e.message)); }
};
